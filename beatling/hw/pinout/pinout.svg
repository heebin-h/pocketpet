<text x="20" y="30" class="h">BEATLING Rev A — ROCK Pi S (RS308-D4) 핀 배치도</text>
<text x="20" y="48" class="s">근거: Radxa ROCK Pi S Product Brief Rev1.5 §3.3 · 모든 GPIO 3.3V (허용 3.63V) · (cN:L) = gpiochipN line L (Rockchip 규칙 계산값, gpioinfo로 대조 필요)</text>
