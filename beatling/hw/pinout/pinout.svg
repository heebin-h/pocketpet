<text x="640" y="926" class="s">예비</text>
<text x="20" y="970" class="s">• Pin 8/10(UART0)은 디버그 콘솔로 가정해 예약 — 실기 /proc/cmdline 의 console= 으로 확인 후 해제 여부 결정</text>
<text x="20" y="990" class="s">• Pin 12/16/18/22(I2S0 TX)를 GPIO로 사용 — 내장 코덱만 쓰므로 외부 I2S 불필요. pinmux 충돌은 /sys/kernel/debug/pinctrl 로 확인</text>
<text x="20" y="1010" class="s">• OLED·RTC 모듈은 반드시 3.3V(Pin 1/17)로 공급 — 5V 공급 시 모듈 풀업이 SDA/SCL을 5V로 끌어 3.63V 허용치 초과</text>
<text x="20" y="1030" class="s">• 보드 전원은 캐리어 USB-C → Pin 2/4 (5V). 보드 자체 USB-C와 동시 연결 금지 (전원 역류) — 계획서 §3 참조</text>
<text x="20" y="1050" class="s">• Pin 27 GND는 마이크 아날로그 리턴 전용으로 분리 배선 (앰프 전류 리턴과 섞지 않음)</text>
<text x="20" y="1070" class="s">• 보드 방향: brief 사진 기준 Pin1은 Header1 하단(이더넷 쪽), Pin27은 Header2 상단(USB-C 쪽) — 실물 실크로 확인</text>
</svg>